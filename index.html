<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search every active ThyToxicGamer chat command across Streamer.bot, StreamElements, and Nightbot." />
    <meta name="theme-color" content="#070a08" />
    <meta property="og:title" content="ThyToxicGamer Command Center" />
    <meta property="og:description" content="Search every active ThyToxicGamer chat command in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thy-toxic-gamer.github.io/thytoxicgamer-commands/" />
    <meta property="og:image" content="https://thy-toxic-gamer.github.io/thytoxicgamer-commands/toxic-command-center-banner-concept-v1.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThyToxicGamer Command Center" />
    <meta name="twitter:description" content="Search every active ThyToxicGamer chat command in one place." />
    <meta name="twitter:image" content="https://thy-toxic-gamer.github.io/thytoxicgamer-commands/toxic-command-center-banner-concept-v1.png" />
    <title>ThyToxicGamer Command Center</title>
    <link rel="preload" as="image" href="toxic-command-center-banner-v1.webp" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css?v=1.3" />
    <link rel="stylesheet" href="permission-colors.css?v=1.3" />
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">⁅𝐓𝐡𝐲𝐓☣︎𝐱𝐢𝐜𝐆𝐚𝐦𝐞𝐫⁆</p>
          <h1>Command Center</h1>
          <p class="intro">Find every active chat command across the Toxic Network.</p>
        </div>
        <div class="count-card"><strong id="total-count">0</strong><span>active commands</span></div>
      </header>

      <figure class="site-banner">
        <img
          src="toxic-command-center-banner-v1.webp"
          width="1935"
          height="813"
          alt="Armored toxic wolf skull between a cracked biohazard symbol and a command terminal"
          fetchpriority="high"
        />
      </figure>

      <section class="command-panel" aria-label="Channel commands">
        <div class="toolbar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Filter by bot"></div>
          <label class="search-box">
            <span class="sr-only">Search commands</span>
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Search commands..." autocomplete="off" />
          </label>
        </div>
        <div class="table-head" aria-hidden="true"><span>Command</span><span>Bot</span><span>Permission</span><span>What it does</span></div>
        <div id="command-list" class="command-list" aria-live="polite"></div>
      </section>

      <footer>
        <span>☣ ThyToxicGamer Command Center</span>
        <span>Commands may be limited by platform or permission.</span>
      </footer>
    </main>
    <script src="script.js?v=1.3"></script>
  </body>
</html>
